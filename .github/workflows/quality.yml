name: Quality checks
on:
  pull_request:
  push:
    branches: [sprint/01-foundation, feat/sprint-1-public-experience]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
